<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameZone | Speed Rush</title>

</head>

<style>

body {
    margin: 0;
    background: #08080f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #a855f7;
    margin-top: 25px;
}

#raceArea {
    position: relative;

    width: 350px;
    height: 550px;

    margin: 25px auto;

    background: #444;

    border-left: 30px solid #222;
    border-right: 30px solid #222;

    overflow: hidden;
}

#playerCar {
    position: absolute;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 45px;
    z-index:5;

    transition: left 0.15s ease;
}

#obstacle {
    position: absolute;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 45px;

    z-index: 5;
}

#restartButton {
    padding: 12px 25px;

    border: none;
    border-radius: 8px;

    background: #a855f7;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

#raceArea::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    width: 6px;
    height: 100%;

    background: repeating-linear-gradient(
        to bottom,
        white 0px,
        white 50px,
        transparent 50px,
        transparent 100px
    );

    z-index: 1;
}

.mobile-controls {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 15px;
}

.mobile-controls button {
    width: 70px;
    height: 50px;

    font-size: 25px;

    border: none;
    border-radius: 10px;

    background: #a855f7;
    color: white;

    cursor: pointer;
}

#startScreen {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: #08080f;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 1000;
}

#startScreen h2 {
    font-size: 40px;
    color: #a855f7;
}

#startButton {
    padding: 15px 30px;

    border: none;
    border-radius: 10px;

    background: #a855f7;
    color: white;

    font-size: 18px;

    cursor: pointer;
}


#pauseButton {
    padding: 12px 25px;

    border: none;
    border-radius: 8px;

    background: #555;
    color: white;

    font-size: 16px;

    cursor: pointer;

    margin-left: 10px;
}

#gameOverScreen {
    display: none;

    animation: gameOverPop 0.3s ease;

    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 300px;

    padding: 30px;

    background: #111;

    border: 2px solid #a855f7;

    border-radius: 15px;

    z-index: 3000;
}

#gameOverScreen h2 {
    color: #ff4444;
}

#finalScore {
    font-size: 40px;
    color: #a855f7;
}

#playAgainButton {
    padding: 12px 25px;

    border: none;
    border-radius: 8px;

    background: #a855f7;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

@keyframes gameOverPop {

    from {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
    }

    to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

}
#raceArea::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    left: 8px;

    width: 5px;

    background: #7b4242;

    z-index: 2;
}

#raceArea::before {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    right: 8px;

    width: 5px;

    background: #ff4444;

    z-index: 2;
}

#raceArea::before,
#raceArea::after {
    display: none;
}

#raceArea {
    box-shadow:
        inset 8px 0 #ff4444,
        inset -8px 0 #ff4444;
}

.center-line {
    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    width: 6px;
    height: 100%;

    background: repeating-linear-gradient(
        to bottom,
        white 0px,
        white 50px,
        transparent 50px,
        transparent 100px
    );

    z-index: 1;
    animation: roadMove 1s linear infinite;
}

@keyframes roadMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 100px;
    }

}

#countdown {
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 70px;

    font-weight: bold;

    color: #0e0e0f;

    z-index: 2000;

    animation: countdownPop 0.8s ease;
}

@keyframes countdownPop {

    from {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0;
    }

    to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

}

#gameStatus {
    font-weight: bold;
    transition: transform 0.2s;
}

@keyframes crashShake {

    0% {
        transform: translate(0, 0);
    }

    25% {
        transform: translate(-8px, 4px);
    }

    50% {
        transform: translate(8px, -4px);
    }

    75% {
        transform: translate(-5px, 3px);
    }

    100% {
        transform: translate(0, 0);
    }

}

#pauseOverlay {
    display: none;

    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 45px;
    font-weight: bold;

    color: white;

    background: rgba(0, 0, 0, 0.8);

    padding: 25px 35px;

    border-radius: 15px;

    z-index: 2500;
}

#coin {
    position: absolute;

    top: -60px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 35px;

    z-index: 5;
    filter: drop-shadow(0 0 8px gold);

    animation: coinSpin 1s linear infinite;
}

@keyframes coinSpin {

    0% {
        transform: translateX(-50%) rotateY(0deg);
    }

    50% {
        transform: translateX(-50%) rotateY(180deg);
    }

    100% {
        transform: translateX(-50%) rotateY(360deg);
    }

}
</style>


<body>

    <div id="startScreen">

    <h2>🏎️ SPEED RUSH</h2>

    <p>Ready to race?</p>

    <button id="startButton">
        🎮 Start Game
    </button>

</div>

<div id="countdown"></div>

    <h1>🏎️ Speed Rush</h1>

    <p>Use ⬅️ and ➡️ to move</p>


    <div id="raceArea">

        <div class="center-line"></div>

        <div id="playerCar">🚗</div>

        <div id="obstacle">🚧</div>

        <div id="coin">🪙</div>

    </div>


    <p>
        🏆 Score:
        <strong id="score">0</strong>
    </p>

    <p>
    ⚡ Level:
    <strong id="level">1</strong>
    </p>

    <p>
    ❤️ Lives:
    <strong id="lives">❤️❤️❤️</strong>
</p>

    <p>
    🏆 High Score:
    <strong id="highScore">0</strong>
</p>


    <p id="gameStatus">
        🎮 Game Started!
    </p>

    <div class="mobile-controls">

    <button id="leftBtn">⬅️</button>

    <button id="rightBtn">➡️</button>

</div>


    <button id="restartButton">
        🔄 Restart
    </button>

    <button id="pauseButton">
    ⏸️ Pause 
</button>

    <audio id="crashSound" src="crash.mp3"></audio>

    <audio id="coinSound" src="coin.mp4"></audio>

    <div id="gameOverScreen">

    <p>TEST GAME OVER</p>

    <h2>💥 GAME OVER</h2>

    <p>Your Score</p>

    <strong id="finalScore">0</strong>

    <p id="lastScore"></p>

    <p id="bestScore"></p>

    <br><br>

    <button id="playAgainButton">
        🔄 Play Again
    </button>

</div>

<script src="speedrush.js"></script>

</body>

</html>
