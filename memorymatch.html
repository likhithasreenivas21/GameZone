<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match | GameZone</title>

    <link rel="stylesheet" href="memorymatch.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>🎮 GAMEZONE</h1>

        <h2>🧠 Memory Match</h2>

        <p>Find all matching pairs!</p>

    </header>


    <!-- GAME INFORMATION -->

    <section class="game-info">

        <div class="info-box">
            <span>⭐ Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="info-box">
            <span>⏱️ Time</span>
            <strong id="timer">60</strong>
        </div>

        <div class="info-box">
            <span>🎯 Moves</span>
            <strong id="moves">0</strong>
        </div>

        <div class="info-box">
            <span>🏆 Best</span>
            <strong id="bestScore">0</strong>
        </div>

    </section>


    <!-- GAME -->

    <main>

        <div id="gameMessage">
            Find the matching cards! 🧠
        </div>


        <!-- CARD BOARD -->

        <div id="gameBoard">

            <button class="card" data-card="0">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="1">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="2">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="3">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="4">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="5">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="6">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="7">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="8">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="9">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="10">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="11">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="12">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="13">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="14">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

            <button class="card" data-card="15">
                <span class="card-front">❓</span>
                <span class="card-back"></span>
            </button>

        </div>


        <!-- RESULT -->

        <div id="resultBox">

            <h2 id="resultTitle"></h2>

            <p id="resultMessage"></p>

            <button id="playAgainButton">
                🔄 Play Again
            </button>

        </div>


        <!-- BUTTONS -->

        <div class="controls">

            <button id="restartButton">
                🔄 Restart
            </button>

            <button id="resetBestButton">
                🗑️ Reset Best
            </button>

            <button id="backButton">
                🏠 GameZone
            </button>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>GAMEZONE 🎮</p>

        <p>Play. Compete. Win.</p>

        <p>© 2026 GameZone. All Rights Reserved.</p>

    </footer>


    <script src="memorymatch.js"></script>

</body>

</html>
