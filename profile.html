<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameZone | Player Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="profile-page">

        <a href="index.html" class="back-btn">
            ← Back to GameZone
        </a>

        <div class="profile-card">

            <div class="profile-avatar">
                🎮
            </div>

            <h1>Gamer123</h1>

            <p class="profile-level">
                Level 12 Player
            </p>

            <!-- STATS -->

            <div class="profile-stats">

                <div class="stat">
                    <strong>12</strong>
                    <span>Games Played</span>
                </div>

                <div class="stat">
                    <strong>8</strong>
                    <span>Wins</span>
                </div>

                <div class="stat">
                    <strong>9850</strong>
                    <span>Best Score</span>
                </div>

            </div>


            <!-- ACHIEVEMENTS -->

            <h2>Achievements 🏆</h2>

            <div class="achievements">

                <div class="achievement">
                    🏆
                    <span>First Win</span>
                </div>

                <div class="achievement">
                    🔥
                    <span>5 Wins</span>
                </div>

                <div class="achievement">
                    🎯
                    <span>Perfect Game</span>
                </div>

            </div>

        </div>

    </section>

</body>

</html>
